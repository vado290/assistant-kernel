; Rebuilt-core TEST environment (phase 3): separate database, test venv, test Discord bot.
; Installed by scripts/core_test_env.ps1 into assistant-data/runtime/kernel-services/programs/.
; The token file assistant-data/config/core-discord.env contains one line:
;   CORE_DISCORD_BOT_TOKEN=...
[program:core-test-dispatcher]
command=/bin/bash -c 'exec env -u PYTHONPATH POSTGRES_DB=assistant_core_test /home/v/AI/assistant-data/runtime/kernel-venvs/test/bin/assistant-kernel-core-dispatcher'
directory=/home/v/AI/assistant-kernel
autostart=false
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/core-test-dispatcher.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/core-test-dispatcher.err.log

[program:core-test-gateway]
command=/bin/bash -c 'set -a; [ -f /home/v/AI/assistant-data/config/core-discord.env ] && . /home/v/AI/assistant-data/config/core-discord.env; set +a; exec env -u PYTHONPATH POSTGRES_DB=assistant_core_test /home/v/AI/assistant-data/runtime/kernel-venvs/test/bin/assistant-kernel-core-gateway'
directory=/home/v/AI/assistant-kernel
autostart=false
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/core-test-gateway.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/core-test-gateway.err.log
