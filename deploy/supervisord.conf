[supervisord]
nodaemon=true
user=root
logfile=/home/v/AI/assistant-data/system-logs/supervisord.log
pidfile=/home/v/AI/assistant-data/supervisord.pid
childlogdir=/home/v/AI/assistant-data/system-logs

[unix_http_server]
file=/run/assistant-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/assistant-supervisor.sock

; ---- rebuilt core (docs/REBUILD_PLAN.md): dispatcher executes runs, gateway talks to Discord.
; Each waits for PostgreSQL itself; start order does not matter.
[program:kernel-core-dispatcher]
priority=20
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-core-dispatcher
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
; a running PM turn may take up to its timeout; the dispatcher drains before exiting
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-core-dispatcher.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-core-dispatcher.err.log

[program:kernel-core-gateway]
priority=30
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-core-gateway
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-core-gateway.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-core-gateway.err.log

; ---- kept unchanged for now (phase 4b decides): legacy HTTP API and the HTTP MCP endpoint.
[program:kernel-api]
priority=10
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-api
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-api.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-api.err.log

[program:kernel-mcp]
priority=10
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-mcp --transport streamable-http
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-mcp.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-mcp.err.log

[program:docling-serve]
command=/usr/bin/env -u PYTHONPATH /opt/docling-venv/bin/docling-serve run
directory=/home/v/AI
environment=UVICORN_HOST="0.0.0.0",UVICORN_PORT="5001",DOCLING_SERVE_ENABLE_UI="1",DOCLING_SERVE_LOAD_MODELS_AT_BOOT="0",HF_HOME="/home/v/.cache/docling/huggingface"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/docling.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/docling.err.log

[include]
files=/home/v/AI/assistant-data/runtime/kernel-services/programs/*.conf
