[supervisord]
nodaemon=true
user=root
logfile=/home/v/AI/assistant-data/system-logs/supervisord.log
pidfile=/home/v/AI/assistant-data/supervisord.pid
childlogdir=/home/v/AI/assistant-data/system-logs

[unix_http_server]
file=/run/assistant-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/assistant-supervisor.sock

[program:kernel-api]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-api
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-api.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-api.err.log

[program:kernel-run-worker]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-run-worker --queue interactive
directory=/home/v/AI/assistant-kernel
numprocs=2
process_name=%(program_name)s-%(process_num)02d
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=900
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-run-worker-%(process_num)02d.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-run-worker-%(process_num)02d.err.log

[program:kernel-runtime-worker]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-run-worker --queue runtime
directory=/home/v/AI/assistant-kernel
numprocs=4
process_name=%(program_name)s-%(process_num)02d
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=3660
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-runtime-worker-%(process_num)02d.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-runtime-worker-%(process_num)02d.err.log

[program:kernel-maintenance]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-maintenance
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-maintenance.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-maintenance.err.log

[program:kernel-scheduler]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-scheduler
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-scheduler.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-scheduler.err.log

[program:kernel-feishu]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-feishu
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-feishu.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-feishu.err.log

[program:kernel-discord]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-discord
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-discord.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-discord.err.log

[program:kernel-mcp]
command=/bin/bash /home/v/AI/assistant-kernel/scripts/run-kernel-service.sh assistant-kernel-mcp --transport streamable-http
directory=/home/v/AI/assistant-kernel
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/kernel-mcp.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/kernel-mcp.err.log

[program:docling-serve]
command=/usr/bin/env -u PYTHONPATH /opt/docling-venv/bin/docling-serve run
directory=/home/v/AI
environment=UVICORN_HOST="0.0.0.0",UVICORN_PORT="5001",DOCLING_SERVE_ENABLE_UI="1",DOCLING_SERVE_LOAD_MODELS_AT_BOOT="0",HF_HOME="/home/v/.cache/docling/huggingface"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/v/AI/assistant-data/system-logs/docling.log
stderr_logfile=/home/v/AI/assistant-data/system-logs/docling.err.log

[include]
files=/home/v/AI/assistant-data/runtime/kernel-services/programs/*.conf
