  pm_handoff: true
harness:
  context_policy: max
  provider: openai
  reasoning_effort: medium
  sandbox: project-scope
  timeout_seconds: 1800
kind: manager
mcp_servers: {}
role: role.md
schema_version: agent-config.v2
scope_profile: current-project
status: active
