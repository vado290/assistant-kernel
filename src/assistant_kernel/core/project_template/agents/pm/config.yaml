- get_authorized_workspace
- list_authorized_tree
- read_authorized_file
- current_conversation_route
- list_recent_history
- run_status
- get_project_map
- query_project_map
- read_map_component
- list_project_changes
- read_change_diff
- refresh_project_map
- get_public_background_fields
- list_source_discovery_roots
- inspect_source_path
- project_task_status
- queue_project_task
- request_operation_report
- list_project_credentials
- volcengine_model_status
- volcengine_generate
- volcengine_ocr
- get_project_credential
- request_project_credential
- delete_project_credential
- write_candidate_file
- delete_candidate_file
- run_project_action
triggers:
- user_message
- handoff
