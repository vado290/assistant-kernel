files.background_header: '# Background archive


  Organisation, industry and project facts this project has collected. Kernel appends a requirements document''s background-archive section when it is approved, each entry dated and naming its task; the latest entry wins.

  '
files.profile_header: '# User profile


  One section per user. Kernel appends a requirements document''s user-profile observations (when the requirements are approved; also, marked as such, when a task ends without approval) and the preferences and corrections the Supervisor noted in conversation; the weekly review may propose tidying it up. Items marked [inferred] are not confirmed by the user; for the same aspect the latest entry wins, and the user''s corrections win.

  '
