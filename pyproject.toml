[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-kernel"
version = "0.33.0"
description = "Control core (tasks, runs, cards), Discord gateway and Kernel tools for the personal super assistant"
requires-python = ">=3.10,<3.11"
dependencies = [
  "croniter==6.2.4",
  "arkruntime==0.8.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp==2.1.1",
  "pydantic==2.13.5",
  "psycopg[binary,pool]==3.3.5",
  "PyYAML==6.0.3",
  "python-dotenv==1.2.3",
  "uvicorn==0.52.4",
  "tiktoken==0.12.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
assistant-kernel-api = "assistant_kernel.api.main:run"
assistant-kernel-mcp = "assistant_kernel.mcp_server.server:run"
assistant-kernel-migrate = "assistant_kernel.core.migrate:run"
assistant-kernel-core-dispatcher = "assistant_kernel.core.dispatch_main:run"
assistant-kernel-core-gateway = "assistant_kernel.core.gateway.discord_app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
assistant_kernel = [
  "contracts/*.json",
  "core/sql/*.sql",
  "prompts/core/*.md",
  "core/project_template/*.yaml",
  "core/project_template/agents/*/*.md",
  "core/project_template/agents/*/*.yaml",
  "core/shared_template/*.md",
  "core/project_template/knowledge/*.md",
  "prompts/skills/*/SKILL.md",
  "prompts/skills/*/references/*.md",
  "prompts/skills/*/scripts/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
